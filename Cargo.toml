[package]
name = "swaddle"
version = "0.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config = "0.15.8"
dbus = "0.9.7"
dirs = "6.0.0"
env_logger = "0.11.5"
log = "0.4.22"
pipewire = "0.10.1"
libspa = "0.10.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"